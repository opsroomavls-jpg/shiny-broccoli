name: WINDOWS-dAIGNOSTICS

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ---------------------------------------------------------
      # Configure Windows Remote Desktop
      # ---------------------------------------------------------
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "=== Configuring Remote Desktop ==="

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Use the standard RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Remove an existing firewall rule with the same name
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow TCP RDP traffic on port 3389
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

          # Verify RDP configuration
          $rdpSettings = Get-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server'

          $rdpTcpSettings = Get-ItemProperty `
            'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Write-Host "fDenyTSConnections: $($rdpSettings.fDenyTSConnections)"
          Write-Host "UserAuthentication: $($rdpTcpSettings.UserAuthentication)"
          Write-Host "SecurityLayer: $($rdpTcpSettings.SecurityLayer)"

          if ($rdpSettings.fDenyTSConnections -ne 0) {
              throw "Remote Desktop is not enabled."
          }

          Write-Host "Remote Desktop configuration completed."


      # ---------------------------------------------------------
      # Create RDP User
      # ---------------------------------------------------------
      - name: Create RDP User
        shell: pwsh
        run: |
          Write-Host "=== Creating RDP User ==="

          # Remove an existing RDP account if one exists
          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "Existing RDP user found. Removing it..."
              Remove-LocalUser -Name "RDP"
          }

          # Character sets
          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $numbers = [char[]](48..57)

          # Use a conservative set of special characters
          # to avoid RDP/shell quoting problems.
          $special = [char[]]"!@#$%^&*_-+="

          # Generate password components
          $passwordChars = @()

          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          # Shuffle characters
          $password = -join ($passwordChars | Sort-Object { Get-Random })

          # Convert to SecureString
          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Create local account
          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires:$true `
            -Description "Temporary RDP account"

          # Add to Administrators
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          # Verify user exists
          $user = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if (-not $user) {
              throw "RDP user creation failed."
          }

          # Store for later workflow steps
          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created successfully."


      # ---------------------------------------------------------
      # Install Tailscale
      # ---------------------------------------------------------
      - name: Install Tailscale
        shell: pwsh
        run: |
          Write-Host "=== Installing Tailscale ==="

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable was not found."
          }

          Write-Host "Tailscale installed successfully."


      # ---------------------------------------------------------
      # Connect Tailscale
      # ---------------------------------------------------------
      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Connecting to Tailscale ==="

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is not configured."
          }

          # Connect the runner to Tailscale
          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale failed to connect."
          }

          Write-Host "Waiting for Tailscale IPv4 address..."

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {

              $candidate = (
                  & $tailscale ip -4 2>$null |
                  Select-Object -First 1
              )

              if ($candidate) {
                  $candidate = $candidate.ToString().Trim()
              }

              if (-not [string]::IsNullOrWhiteSpace($candidate)) {
                  $tsIP = $candidate
                  break
              }

              Write-Host "Attempt $($i + 1)/12: IP not available yet."
              Start-Sleep -Seconds 5
          }

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
              throw "Tailscale IP was not assigned."
          }

          Write-Host "Tailscale IPv4: $tsIP"

          # Store the IP for later steps
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV


      # ---------------------------------------------------------
      # Verify RDP
      # ---------------------------------------------------------
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "=== Verifying RDP ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
              throw "TAILSCALE_IP is empty."
          }

          # Check that the RDP service is running
          $service = Get-Service -Name TermService

          Write-Host "TermService status: $($service.Status)"

          if ($service.Status -ne "Running") {
              Write-Host "Starting Remote Desktop service..."
              Start-Service -Name TermService
          }

          # Check that Windows is listening on TCP 3389
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "Nothing is listening on TCP port 3389."
          }

          Write-Host "RDP is listening on TCP port 3389."

          # Local connectivity test
          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              throw "TCP connection to RDP port 3389 failed."
          }

          Write-Host "TCP connectivity successful."


      # ---------------------------------------------------------
      # Display connection information
      # ---------------------------------------------------------
      - name: Display RDP Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP ACCESS"
          Write-Host "=============================================="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "The runner will remain active."


      # ---------------------------------------------------------
      # Keep runner alive
      # ---------------------------------------------------------
      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "=== Maintaining RDP Session ==="

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
              Start-Sleep -Seconds 300
          }
